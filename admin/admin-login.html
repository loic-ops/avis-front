<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Connexion Admin - Ottica Vision</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      font-family: 'Segoe UI', sans-serif;
      background: linear-gradient(135deg, #95d6b9 0%, #71cba6 100%);
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 20px;
    }
    .login-card {
      background: white;
      border-radius: 16px;
      box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
      padding: 40px;
      max-width: 380px;
      width: 100%;
      text-align: center;
    }
    .login-icon {
      font-size: 48px;
      margin-bottom: 20px;
    }
    .login-card h1 {
      font-size: 24px;
      color: #102a43;
      margin-bottom: 12px;
    }
    .login-card p {
      color: #475569;
      margin-bottom: 30px;
      font-size: 14px;
    }
    .code-input-group {
      display: flex;
      gap: 8px;
      justify-content: center;
      margin-bottom: 24px;
    }
    .code-input-group input {
      width: 50px;
      height: 50px;
      border: 2px solid #d9e2ec;
      border-radius: 8px;
      font-size: 24px;
      text-align: center;
      font-weight: bold;
      color: #102a43;
      transition: border-color 0.3s;
    }
    .code-input-group input:focus {
      outline: none;
      border-color: #2d6a4f;
      box-shadow: 0 0 0 3px rgba(45, 106, 79, 0.1);
    }
    .code-input-group input.error {
      border-color: #d62828;
    }
    .error-message {
      color: #d62828;
      font-size: 13px;
      margin-bottom: 16px;
      min-height: 20px;
    }
    .login-button {
      width: 100%;
      padding: 12px;
      background: #2d6a4f;
      color: white;
      border: none;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      transition: background 0.3s, transform 0.1s;
    }
    .login-button:hover:not(:disabled) {
      background: #1b4332;
      transform: translateY(-2px);
    }
    .login-button:disabled {
      background: #94a3b8;
      cursor: not-allowed;
    }
    .info-text {
      font-size: 12px;
      color: #94a3b8;
      margin-top: 16px;
    }
  </style>
</head>
<body>
  <div class="login-card">
    <div class="login-icon">🔐</div>
    <h1>Accès Administrateur</h1>
    <p>Entrez votre code d'identification à 6 chiffres</p>
    
    <div class="code-input-group" id="codeInputGroup">
      <input type="text" inputmode="numeric" maxlength="1" class="code-digit" />
      <input type="text" inputmode="numeric" maxlength="1" class="code-digit" />
      <input type="text" inputmode="numeric" maxlength="1" class="code-digit" />
      <input type="text" inputmode="numeric" maxlength="1" class="code-digit" />
      <input type="text" inputmode="numeric" maxlength="1" class="code-digit" />
      <input type="text" inputmode="numeric" maxlength="1" class="code-digit" />
    </div>
    
    <div class="error-message" id="errorMsg"></div>
    
    <button class="login-button" id="loginBtn">Connexion</button>
    <p class="info-text">Code fourni par l'administrateur</p>
  </div>

  <script>
    const API_BASE = 'https://avis-api-production.up.railway.app/';
    const digits = document.querySelectorAll('.code-digit');
    const errorMsg = document.getElementById('errorMsg');
    const loginBtn = document.getElementById('loginBtn');

    // Gestion de la saisie des chiffres
    digits.forEach((input, index) => {
      input.addEventListener('input', (e) => {
        if (e.target.value && /^\d$/.test(e.target.value)) {
          if (index < digits.length - 1) {
            digits[index + 1].focus();
          }
          errorMsg.textContent = '';
          input.classList.remove('error');
        } else if (e.target.value) {
          e.target.value = '';
        }
      });

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Backspace' && !e.target.value && index > 0) {
          digits[index - 1].focus();
        } else if (e.key === 'Enter') {
          authenticateAdmin();
        }
      });
    });

    const API  = (window.location.hostname === 'localhost' || window.location.hostname === '127.0.0.1')
      ? 'http://127.0.0.1:8000'
      : 'https://avis-api-production.up.railway.app/'; // Remplacez par l’URL de production de votre API


    async function authenticateAdmin() {
      const code = Array.from(digits).map(d => d.value).join('');
      
      if (code.length !== 6) {
        errorMsg.textContent = 'Veuillez entrer 6 chiffres';
        digits.forEach(d => d.classList.add('error'));
        return;
      }

      loginBtn.disabled = true;
      loginBtn.textContent = 'Vérification…';

      try {
        const res = await fetch(`${API }/api/admin/verify`, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ code })
        });

        if (res.ok) {
          const data = await res.json();
          localStorage.setItem('adminToken', data.token);
          window.location.href = 'reviews.html';
        } else {
          errorMsg.textContent = 'Code incorrect!';
          digits.forEach(d => {
            d.value = '';
            d.classList.add('error');
          });
          digits[0].focus();
        }
      } catch (err) {
        errorMsg.textContent = 'Erreur de connexion';
        console.error(err);
      }

      loginBtn.disabled = false;
      loginBtn.textContent = 'Connexion';
    }

    loginBtn.addEventListener('click', authenticateAdmin);

    // Focus sur le premier input au chargement
    window.addEventListener('load', () => {
      digits[0].focus();
    });
  </script>
</body>
</html>
